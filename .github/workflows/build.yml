name: build

# P1 of docs/ASSESSMENT.md: does the vayu board description still describe the
# hardware correctly against this kernel? A green run means "the DTB (and
# optionally the Image) compiles"; it does not mean the device boots.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Also build the full arm64 Image (slow)
        type: boolean
        default: false
      config_only:
        description: Stop after verifying the config (no compile)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      WANT_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.full || 'false' }}
      CONFIG_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.config_only || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            clang-18 lld-18 llvm-18
          # LLVM's own bin dir carries the unversioned names the kernel's
          # LLVM=1 mode and the CFI/LTO helpers expect.
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          echo "BUILD_DIR=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
          clang --version | head -1

      - name: Check vendored tree against kernel.lock
        run: |
          set -euo pipefail
          want=$(sed -n 's/^version=//p' kernel.lock)
          got=$(make -s -C kernel kernelversion)
          echo "kernel.lock: $want / Makefile: $got"
          [ "$want" = "$got" ] || { echo "vendored tree does not match kernel.lock" >&2; exit 1; }

      # A full arm64 build of this config is ~45 minutes, and a hosted runner
      # can be preempted while linking vmlinux (observed once). Restoring the
      # previous out-of-tree build directory turns a retry into an incremental
      # build, which is what makes "is the kernel name right?" cheap to re-check.
      - name: Restore build directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/build
          key: build-${{ hashFiles('kernel.lock', 'configs/vayu-android17.config', 'configs/vayu-mainline.fragment') }}-${{ github.run_id }}
          restore-keys: |
            build-${{ hashFiles('kernel.lock', 'configs/vayu-android17.config', 'configs/vayu-mainline.fragment') }}-

      - name: Configure
        run: |
          set -euo pipefail
          # LineageOS 24.0's 5.4 config, filtered to symbols this tree still
          # defines, then the upstream drivers the vendor config never needed.
          mkdir -p "$BUILD_DIR"
          # The generated file already contains the fragment; see
          # scripts/gen-config.py and configs/README.md.
          cp configs/vayu-android17.config "$BUILD_DIR/.config"
          # This runner has 16 GB, and linking vmlinux.o with the config's
          # DEBUG_INFO + DWARF4 peaks at 15.9 GB and gets the job killed
          # (measured in the heartbeat). Debug info does not change codegen or
          # the Image bytes - it only bloats vmlinux - so CI links without it.
          # The committed config keeps it, because a device with no UART needs
          # symbols to read a crash out of ramoops.
          kernel/scripts/config --file "$BUILD_DIR/.config" \
            -d DEBUG_INFO -e DEBUG_INFO_NONE
          make -C kernel O="$BUILD_DIR" ARCH=arm64 LLVM=1 olddefconfig 2>&1 | tee /tmp/olddefconfig.log
          grep -E '^(CONFIG_DEBUG_INFO|# CONFIG_DEBUG_INFO)' "$BUILD_DIR/.config" | head -3 || true

      # A fresh checkout stamps every source with the current time, so make
      # treats every restored object as stale and rebuilds the whole kernel.
      # Pinning the sources to an old date is what makes the cache restore
      # actually save work.
      - name: Age kernel sources so cached objects stay valid
        run: |
          set -euo pipefail
          find kernel -exec touch -h -d '2026-01-01 00:00:00' {} +
          echo "sources dated: $(find kernel -newermt '2026-06-01' -type f | wc -l) files newer than June"

      - name: Verify config
        run: |
          set -euo pipefail
          # Tristate, so y or m both count: olddefconfig clamps a symbol to the
          # strongest value its dependencies allow, and Android loads drivers as
          # modules by design.
          required="
            CONFIG_ARM64
            CONFIG_ARCH_QCOM
            CONFIG_PINCTRL_SM8150
            CONFIG_QCOM_CLK_RPMH
            CONFIG_INTERCONNECT_QCOM_SM8150
            CONFIG_DRM_MSM
            CONFIG_SCSI_UFS_QCOM
            CONFIG_PHY_QCOM_QMP_UFS
            CONFIG_USB_DWC3
            CONFIG_ATH10K_SNOC
            CONFIG_QCOM_Q6V5_PAS
            CONFIG_SERIAL_QCOM_GENI
          "
          missing=0
          for sym in $required; do
            # grep exits 1 when nothing matches; under pipefail that
            # would abort the step instead of reporting the symbol.
            value=$(grep -m1 -E "^${sym}=" "$BUILD_DIR/.config" || true)
            if [ -z "$value" ] || ! echo "$value" | grep -qE "=[ym]$"; then
              echo "::error::${sym} is not built-in or modular"
              missing=$((missing + 1))
            else
              echo "$value"
            fi
          done
          if ! grep -qx 'CONFIG_LOCALVERSION="-vayu-kyler084"' "$BUILD_DIR/.config"; then
            echo "::error::CONFIG_LOCALVERSION is not -vayu-kyler084"
            missing=$((missing + 1))
          fi
          # Requirements of this ACK tree, not preferences: f2fs does not
          # compile without the unfair rwsem, and GKI_HACKS_TO_FIX drags in
          # HMM_MIRROR without the MMU_NOTIFIER API hmm.c needs.
          if ! grep -qx 'CONFIG_F2FS_UNFAIR_RWSEM=y' "$BUILD_DIR/.config"; then
            echo "::error::CONFIG_F2FS_UNFAIR_RWSEM is not set"
            missing=$((missing + 1))
          fi
          if ! grep -qx 'CONFIG_DEBUG_INFO_NONE=y' "$BUILD_DIR/.config"; then
            echo "::error::CI must link without debug info: 16 GB is not enough for the DWARF link"
            missing=$((missing + 1))
          fi
          for off in CONFIG_GKI_HACKS_TO_FIX CONFIG_HMM_MIRROR; do
            # Selected symbols cannot be unset from .config, so a failure here
            # means something else selects the gate and the pairing is broken.
            if grep -qx "${off}=y" "$BUILD_DIR/.config"; then
              echo "::error::${off} is enabled (uncompilable HMM configuration)"
              missing=$((missing + 1))
            fi
          done
          echo "--- wireless dependency chain ---"
          grep -E "ATH10K|QCOM_SMEM|HWSPINLOCK|QCOM_RPROC_COMMON|MAC80211|CFG80211" "$BUILD_DIR/.config" || true
          echo "--- olddefconfig warnings mentioning these symbols ---"
          grep -iE "ath10k|qcom_smem|rproc_common" /tmp/olddefconfig.log || true
          [ "$missing" -eq 0 ] || { echo "$missing required symbol(s) not set"; exit 1; }
          echo "--- dependency chain for the wireless stack ---"
          grep -E "^(CONFIG_(HWSPINLOCK|QCOM_SMEM|QCOM_RPROC_COMMON|REMOTEPROC|MAC80211|CFG80211|ATH10K|ATH10K_SNOC)=|# CONFIG_(HWSPINLOCK|QCOM_SMEM|QCOM_RPROC_COMMON|MAC80211|CFG80211|ATH10K|ATH10K_SNOC) is not set)" "$BUILD_DIR/.config" || true
          grep -c '^CONFIG_' "$BUILD_DIR/.config" | sed 's/^/configured symbols: /'

      - name: Build DTBs
        if: env.CONFIG_ONLY != 'true'
        run: |
          set -euo pipefail
          make -C kernel O="$BUILD_DIR" -j"$(nproc)" ARCH=arm64 LLVM=1 dtbs
          dtb="$BUILD_DIR/arch/arm64/boot/dts/qcom/sm8150-xiaomi-vayu.dtb"
          python3 - "$dtb" <<'PY'
          import sys
          data = open(sys.argv[1], "rb").read()
          assert data[:4] == b"\xd0\x0d\xfe\xed", data[:4]
          assert b"Xiaomi POCO X3 Pro" in data, "model string missing"
          print(f"FDT ok: {sys.argv[1]} ({len(data)} bytes)")
          PY

      # Hosted runners on this repo stop a job about 30 minutes in (SIGTERM,
      # "runner has received a shutdown signal"), which is shorter than one full
      # build. So the build gets a 20-minute window, the cache save runs
      # afterwards, and each dispatch advances the work by one window until the
      # Image exists. The box below reports where the window ended.
      - name: Build Image
        if: env.WANT_IMAGE == 'true' && env.CONFIG_ONLY != 'true'
        run: |
          set -euo pipefail
          timeout --signal=TERM 1200 make -C kernel O="$BUILD_DIR" \
            -j"$(nproc)" ARCH=arm64 LLVM=1 Image > /tmp/image.log 2>&1 &
          build=$!
          while kill -0 "$build" 2>/dev/null; do
            sleep 60
            kill -0 "$build" 2>/dev/null || break
            printf 'build running: %s lines, %s in build dir, %s, last: %s\n' \
              "$(wc -l < /tmp/image.log)" \
              "$(du -sh "$BUILD_DIR" | cut -f1)" \
              "$(free -m | awk '/^Mem:/{print $3"/"$2" MB used"}')" \
              "$(tail -n 1 /tmp/image.log)"
          done
          rc=0
          wait "$build" || rc=$?
          tail -n 30 /tmp/image.log
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 143 ]; then
            echo "INCOMPLETE=1" >> "$GITHUB_ENV"
            echo "::warning::build window elapsed; the build directory is cached, re-dispatch to continue"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"

      # The assertions live in their own step so a partial build can still save
      # its progress before the run is reported as unfinished.
      - name: Verify Image carries the kernel name
        if: env.WANT_IMAGE == 'true' && env.CONFIG_ONLY != 'true' && env.INCOMPLETE != '1'
        run: |
          set -euo pipefail
          python3 - "$BUILD_DIR/arch/arm64/boot/Image" <<'PY'
          import struct, sys
          with open(sys.argv[1], "rb") as f:
              magic = struct.unpack_from("<I", f.read(64), 56)[0]
          assert magic == 0x644d5241, hex(magic)   # "ARMd"
          print("arm64 Image header ok")
          PY
          # Settings > About phone > Kernel version reports `uname -r`, i.e.
          # kernel.release. Assert the name the device would show, then prove
          # it is actually embedded in the Image that would be flashed.
          release=$(cat "$BUILD_DIR/include/config/kernel.release")
          echo "kernel.release: $release"
          case "$release" in
            *vayu-kyler084*) echo "uname -r is $release" ;;
            *) echo "::error::kernel release does not carry vayu-kyler084: $release"; exit 1 ;;
          esac
          if ! grep -aq -- '-vayu-kyler084' "$BUILD_DIR/arch/arm64/boot/Image"; then
            echo "::error::version name missing from Image"
            exit 1
          fi
          echo "version string present in Image"

      - name: Package boot.img
        if: env.WANT_IMAGE == 'true' && env.CONFIG_ONLY != 'true' && env.INCOMPLETE != '1'
        run: |
          set -euo pipefail
          kernel="$BUILD_DIR/arch/arm64/boot/Image"
          dtb="$BUILD_DIR/arch/arm64/boot/dts/qcom/sm8150-xiaomi-vayu.dtb"
          out="$RUNNER_TEMP/vayu-boot.img"
          python3 scripts/mkbootimg.py build --kernel "$kernel" --dtb "$dtb" -o "$out"
          python3 scripts/mkbootimg.py verify --image "$out" \
            --expect-kernel "$kernel" --expect-dtb "$dtb" \
            --expect-model "Xiaomi POCO X3 Pro" \
            --kernel-release "$(cat "$BUILD_DIR/include/config/kernel.release")"

      - name: Report an unfinished build
        if: env.INCOMPLETE == '1'
        run: |
          echo "::error::Image not built within one window; progress is cached, dispatch the workflow again"
          exit 1

      - uses: actions/upload-artifact@v4
        if: env.CONFIG_ONLY != 'true'
        with:
          name: vayu-dtb
          path: ${{ runner.temp }}/build/arch/arm64/boot/dts/qcom/sm8150-xiaomi-vayu.dtb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vayu-config
          path: ${{ runner.temp }}/build/.config
          include-hidden-files: true
          if-no-files-found: warn

      # Even a failed build leaves most objects behind, and restoring them is
      # what makes the next attempt finish instead of starting over.
      - name: Save build directory
        if: always() && env.CONFIG_ONLY != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/build
          key: build-${{ hashFiles('kernel.lock', 'configs/vayu-android17.config', 'configs/vayu-mainline.fragment') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: env.WANT_IMAGE == 'true' && env.CONFIG_ONLY != 'true' && env.INCOMPLETE != '1'
        with:
          name: vayu-boot
          path: ${{ runner.temp }}/vayu-boot.img
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.WANT_IMAGE == 'true' && env.CONFIG_ONLY != 'true'
        with:
          name: vayu-Image
          path: |
            ${{ runner.temp }}/build/arch/arm64/boot/Image
            ${{ runner.temp }}/build/.config
          if-no-files-found: error
